<!doctype html>
<!--
  Static canvas for the Power BI report page (1920 x 1080).
  Rendered to design/background.png (headless Edge, see build_report.py) and set as
  the page background; the live Power BI visuals sit on top of the cards.
  Card coordinates here must match the layout in build_report.py.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif;
               background: radial-gradient(1200px 700px at 78% -10%, #FBD3D8 0%, rgba(251,211,216,0) 60%),
                           radial-gradient(900px 600px at 40% 110%, #F9D0D5 0%, rgba(249,208,213,0) 60%),
                           linear-gradient(135deg, #FFF4F5 0%, #FDE6E9 100%); }
  .abs { position: absolute; }

  /* dotted texture */
  .dots { left: 96px; top: 0; width: 1824px; height: 1080px; opacity: .35;
          background-image: radial-gradient(rgba(226,55,68,.18) 1px, transparent 1.2px); background-size: 22px 22px; }

  /* left rail */
  .rail { left: 0; top: 0; width: 96px; height: 1080px; background: linear-gradient(180deg, #E23744 0%, #B3172A 55%, #7E0D18 100%);
          box-shadow: 6px 0 24px -12px rgba(126,13,24,.6); }
  .ico { position: absolute; left: 24px; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; }
  .ico svg { width: 26px; height: 26px; fill: none; stroke: rgba(255,255,255,.85); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ico.on { background: #FFFFFF; box-shadow: 0 10px 20px -8px rgba(40,0,6,.55); }
  .ico.on svg { stroke: #E23744; }

  /* header */
  .title { left: 128px; top: 16px; font-size: 46px; font-weight: 800; color: #1D1D22; letter-spacing: -1px; }
  .title span { color: #E23744; }
  .subtitle { left: 132px; top: 78px; font-size: 14px; color: #6B6C76; letter-spacing: .2px; }
  .by { left: 470px; top: 38px; font-size: 12px; color: #8B8C96; line-height: 1.2; }
  .by b { display: block; color: #A3121F; font-size: 16px; letter-spacing: .6px; }

  /* cards */
  .card { background: #FFFFFF; border-radius: 18px; box-shadow: 0 18px 34px -22px rgba(126,13,24,.55), 0 1px 0 rgba(226,55,68,.06); overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 4px; background: linear-gradient(90deg, #E23744, #F6B3B9); }

  /* hero */
  .hero { left: 120px; top: 112px; width: 640px; height: 176px; border-radius: 22px; overflow: hidden;
          background: linear-gradient(120deg, #E23744 0%, #C51F33 55%, #8E0F1D 100%);
          box-shadow: 0 22px 40px -22px rgba(126,13,24,.85); }
  .hero .brand { position: absolute; left: 30px; top: 20px; font-size: 36px; font-weight: 800; font-style: italic; color: #FFFFFF; letter-spacing: -.5px; }
  .hero .copy { position: absolute; left: 30px; top: 78px; width: 380px; font-size: 16px; line-height: 1.5; color: #FCE1E4; font-style: italic; }
  .hero .copy b { color: #FFFFFF; font-style: normal; }
  .hero svg.ill { position: absolute; right: 18px; top: 8px; width: 200px; height: 165px; }
  .blob { position: absolute; border-radius: 50%; background: rgba(255,255,255,.09); }

  /* overview panel (dark) */
  .overview { left: 120px; top: 304px; width: 638px; height: 166px; border-radius: 18px; overflow: hidden;
              background: linear-gradient(125deg, #2A0A0F 0%, #4E0A15 55%, #7E0D18 100%);
              box-shadow: 0 22px 40px -24px rgba(42,10,15,.9); }
  .overview .glow { position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%;
                    background: radial-gradient(circle, rgba(226,55,68,.55), rgba(226,55,68,0) 70%); }
  .label { position: absolute; font-size: 20px; font-weight: 700; color: #1D1D22; }
  .label.light { color: #FFFFFF; }
  .accent { position: absolute; height: 4px; width: 36px; border-radius: 4px; background: #E23744; }
  .accent.light { background: #F6B3B9; }
  .divider { position: absolute; width: 1px; background: rgba(255,255,255,.14); }

  .badge { position: absolute; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #E23744, #A3121F);
           display: grid; place-items: center; border: 3px solid #fff; box-shadow: 0 10px 18px -8px rgba(163,18,31,.8); }
  .badge svg { width: 26px; height: 26px; fill: none; stroke: #FFFFFF; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="abs dots"></div>

  <!-- left icon rail -->
  <div class="abs rail">
    <div class="ico on" style="top:28px"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></div>
    <div class="ico" style="top:120px"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg></div>
    <div class="ico" style="top:196px"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
    <div class="ico" style="top:272px"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg></div>
    <div class="ico" style="top:348px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 8.5c-.6-.9-1.6-1.5-2.8-1.5-1.8 0-3 1-3 2.4 0 3.2 6 1.8 6 5 0 1.4-1.3 2.6-3.2 2.6-1.3 0-2.4-.6-3-1.6M12 5v2M12 17v2"/></svg></div>
    <div class="ico" style="top:1004px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></div>
  </div>

  <!-- header (the pulsing LIVE pill is a Power BI image visual at x=716) -->
  <div class="abs title">Dash<span>board</span></div>
  <div class="abs subtitle">Zomato Bangalore · Restaurant ratings, pricing &amp; engagement</div>
  <div class="abs by">Created by<b>ANIMESH</b></div>

  <!-- hero panel -->
  <div class="abs hero">
    <span class="blob" style="width:240px;height:240px;right:-50px;top:-70px"></span>
    <span class="blob" style="width:130px;height:130px;right:170px;bottom:-70px"></span>
    <span class="blob" style="width:60px;height:60px;left:300px;top:-20px"></span>
    <div class="brand">Zomato</div>
    <div class="copy">Analysing <b>41,190</b> rated restaurants across <b>92</b> Bangalore areas, <b>85</b> cuisines and <b>14.5M</b> customer votes.</div>
    <svg class="ill" viewBox="0 0 200 165">
      <ellipse cx="104" cy="152" rx="86" ry="9" fill="#5C0A14" opacity=".35"/>
      <rect x="92" y="10" width="62" height="118" rx="12" fill="#3A0610" opacity=".25"/>
      <rect x="88" y="6" width="62" height="118" rx="12" fill="#FFFFFF" stroke="#FCE1E4" stroke-width="3"/>
      <rect x="96" y="20" width="46" height="74" rx="4" fill="#FDE7EA"/>
      <path d="M100 76 L114 58 L124 68 L138 44" fill="none" stroke="#E23744" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="138" cy="44" r="4" fill="#E23744"/>
      <rect x="110" y="104" width="18" height="4" rx="2" fill="#F1C9CD"/>
      <path d="M160 30c0-9 7-16 16-16s16 7 16 16c0 13-16 28-16 28s-16-15-16-28z" fill="#FFFFFF"/>
      <circle cx="176" cy="30" r="6" fill="#E23744"/>
      <path d="M14 112h92a46 30 0 0 1-92 0z" fill="#FFFFFF"/>
      <rect x="10" y="108" width="100" height="7" rx="3.5" fill="#FCE1E4"/>
      <path d="M30 104c2-8 10-12 18-10 4-6 14-8 20-2 8-2 16 2 18 12" fill="#F6B3B9" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M34 92c-4-6 4-10 0-16M50 86c-4-6 4-10 0-16M66 92c-4-6 4-10 0-16" fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M78 64l38 40M86 60l36 42" stroke="#3A0610" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- overview panel (4 KPI visuals sit inside) -->
  <div class="abs overview"><div class="glow"></div></div>
  <div class="label light" style="left:148px;top:318px">Overview</div>
  <div class="accent light" style="left:150px;top:350px"></div>
  <div class="divider" style="left:283px;top:372px;height:76px"></div>
  <div class="divider" style="left:439px;top:372px;height:76px"></div>
  <div class="divider" style="left:595px;top:372px;height:76px"></div>

  <!-- 3 animated gauge cards -->
  <div class="abs card" style="left:120px;top:500px;width:200px;height:170px"></div>
  <div class="abs card" style="left:339px;top:500px;width:200px;height:170px"></div>
  <div class="abs card" style="left:558px;top:500px;width:200px;height:170px"></div>
  <div class="badge" style="left:138px;top:484px"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg></div>
  <div class="badge" style="left:357px;top:484px"><svg viewBox="0 0 24 24"><path d="M7 20h10M12 16v4M6 4h12v4a6 6 0 0 1-12 0zM6 6H3v1a3 3 0 0 0 3 3M18 6h3v1a3 3 0 0 1-3 3"/></svg></div>
  <div class="badge" style="left:576px;top:484px"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 7v12h16V7M8 3v4M16 3v4M8 12h3M8 15h6"/></svg></div>

  <!-- two donut cards -->
  <div class="abs card" style="left:120px;top:688px;width:310px;height:376px"></div>
  <div class="abs card" style="left:448px;top:688px;width:310px;height:376px"></div>

  <!-- 12 chart cards: 3 columns x 4 rows -->
  <div id="grid"></div>
  <script>
    const xs = [776, 1157, 1538], ys = [112, 354, 596, 838], W = 366, H = 226;
    let html = "";
    for (const y of ys) for (const x of xs)
      html += `<div class="abs card" style="left:${x}px;top:${y}px;width:${W}px;height:${H}px"></div>`;
    document.getElementById("grid").innerHTML = html;
  </script>
</body>
</html>
